<!DOCTYPE html>
<html lang="en">
  <div id="header"></div>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose Email</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5" style="max-width: 600px">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Compose Email</h3>
        <a href="inbox.html" class="btn btn-secondary">Back to Inbox</a>
      </div>

      <form id="composeForm">
        <div class="mb-3">
          <label for="recipient" class="form-label">To (Email)</label>
          <input type="email" class="form-control" id="recipient" required />
        </div>
        <div class="mb-3">
          <label for="subject" class="form-label">Subject</label>
          <input type="text" class="form-control" id="subject" required />
        </div>
        <div class="mb-3">
          <label for="body" class="form-label">Message</label>
          <textarea class="form-control" id="body" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
        <p id="message" class="mt-3 text-success"></p>
      </form>
    </div>

    <script>
      document.getElementById("composeForm").onsubmit = function (e) {
        e.preventDefault();

        const emailData = {
          recipient: document.getElementById("recipient").value,
          subject: document.getElementById("subject").value,
          body: document.getElementById("body").value,
        };

        fetch("../api/send_email.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(emailData),
        })
          .then((res) => res.json())
          .then((data) => {
            const msg = document.getElementById("message");
            if (data.status === "success") {
              msg.innerText = "✅ Email sent!";
              msg.classList.remove("text-danger");
              msg.classList.add("text-success");
              document.getElementById("composeForm").reset();
            } else {
              msg.innerText = "❌ " + data.message;
              msg.classList.remove("text-success");
              msg.classList.add("text-danger");
            }
          })
          .catch((err) => {
            document.getElementById("message").innerText =
              "❌ Error sending email.";
            console.error(err);
          });
      };
    </script>
  </body>
</html>
